name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile -t project-s-server:ci .
      - name: Health check
        run: |
          docker run -d --name ps -p 127.0.0.1:27016:27016 project-s-server:ci
          for i in $(seq 1 30); do curl -fs localhost:27016/health && break; sleep 1; done
          curl -fs localhost:27016/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:27016/status)" = 401
          docker rm -f ps
      - run: docker compose -f deploy/docker/compose.yaml config -q
  systemd:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit file lints cleanly (ExecStart binary absent on the runner is expected)
        run: |
          systemd-analyze verify deploy/systemd/projet-s-server.service 2>&1 | grep -v "projet-s-server: No such file\|Command .* is not executable" | (! grep -E "error|Unknown")
