name: Release

# Builds the dedicated server archive for a release-please tag and attaches it
# to the GitHub release, with the content at the version pinned in .content-version.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    # 22.04 (glibc 2.35) so the binary runs on Debian 12 / Ubuntu 22.04 hosts.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: content
        run: echo "ref=$(tr -d '[:space:]' < .content-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: SforSkill/Project-s-content
          ref: ${{ steps.content.outputs.ref }}
          path: Project-s-content
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p ps-server
      - run: python3 tools/package.py linux-server --content Project-s-content
      - name: Smoke test of the packaged server
        run: |
          mkdir smoke && tar xzf dist/Project-S-Dedicated-Server-Linux-x64.tar.gz -C smoke
          cd smoke/projet-s-server && ./projet-s-server --check --config deploy/server.example.toml
      - name: Create the release if missing and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --verify-tag --title "Project S server — $TAG" --notes "Voir CHANGELOG.md"
          gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber

  image:
    # Publishes the server image to ghcr.io/sforskill/project-s-server:<version>.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ghcr.io/sforskill/project-s-server:${{ env.TAG }}
