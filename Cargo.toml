[workspace]
resolver = "3"
members = ["crates/ps-server", "crates/ps-visibility"]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.90"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/SforSkill/Project-s-server"

[workspace.dependencies]
ps-visibility = { path = "crates/ps-visibility", version = "0.2.0-alpha.1" }

ps-transport = { git = "https://github.com/SforSkill/Project-s-netcode", tag = "v0.1.0" }
ps-sim-core = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-physics = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-hitreg = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-weapons = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-rules = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-sim = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-sim-net = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }

glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
getrandom = "0.4"
tokio = { version = "1", features = ["rt", "net", "macros", "time", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
prometheus-client = "0.26"
ctrlc = { version = "3", features = ["termination"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
