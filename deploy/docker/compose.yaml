# docker compose -f deploy/docker/compose.yaml up -d --build
# The admin port is published on the host loopback only. Put the admin token in
# deploy/docker/.env (not versioned): PROJET_S_ADMIN_TOKEN=<long random value>
name: projet-s
services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: project-s-server:0.2.0-alpha.1
    restart: unless-stopped
    ports:
      - "27015:27015/udp"
      - "127.0.0.1:27016:27016/tcp"
    environment:
      PROJET_S_ADMIN_TOKEN: ${PROJET_S_ADMIN_TOKEN:-}
    volumes:
      - replays:/var/lib/projet-s/replays
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
volumes:
  replays:
